site_name: FTC Club · Onshape
theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.keys
  - attr_list
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
  - js/club.js?v=6
extra_css:
  - css/club.css?v=6
not_in_nav: |
  review.md
exclude_docs: |
  advanced.md
  submit.md
  img/adv/
nav:
  - Home: index.md
  - "Lesson 1: Sketch and part": lesson-1.md
  - "Homework 1": homework-1.md
  - "Lesson 2: Sketch in depth": lesson-2.md
  - "Practice": practice.md
