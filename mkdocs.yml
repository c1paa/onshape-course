site_name: FTC Club · Onshape
theme:
  name: material
  palette:
    primary: indigo
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.keys
  - attr_list
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
  - js/club.js?v=11
extra_css:
  - css/club.css?v=11
not_in_nav: |
  review.md
exclude_docs: |
  submit.md
  img/adv/
nav:
  - Home: index.md
  - "Lesson 1: Sketch and part": lesson-1.md
  - "Homework 1": homework-1.md
  - "Lesson 2: Sketch in depth": lesson-2.md
  - "Lesson 3: From sketch to parts": lesson-3.md
  - "Lesson 4: Assemblies": lesson-4.md
  - "Practice": practice.md
  - "Team robot":
    - robot/index.md
    - robot/sub-1.md
    - robot/sub-2.md
    - robot/sub-3.md
    - robot/sub-4.md
    - robot/sub-5.md
